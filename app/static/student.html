<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teachify Student</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { padding: 14px; max-width: 460px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .score { display: flex; gap: 6px; font-weight: 700; }
  .score span { background: var(--ink); color: #fff; border-radius: 99px; padding: 3px 10px; font-size: 13px; }
  .score .xp { background: var(--high); color: var(--ink); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
  .tabs button { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 11px; font-size: 13px; color: var(--ink); }
  .tabs button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .card { background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px; padding: 14px; box-shadow: 3px 3px 0 var(--ink); }
  .ask { color: var(--muted); font-size: 13px; }
  .problem { font: 700 25px/1.25 var(--mono); margin: 2px 0 12px; overflow-wrap: anywhere; }
  label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px; }
  textarea {
    width: 100%; height: 118px; resize: vertical; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px;
    font: 16px/1.5 var(--mono); background: #fff; color: var(--ink);
  }
  .check { width: 100%; margin-top: 10px; padding: 11px; font-size: 16px; }
  .photo { width: 100%; margin-top: 10px; padding: 11px; font-size: 16px; }
  .photo:disabled, .photo:disabled:hover { background: var(--card); opacity: .6; }
  .result { margin-top: 12px; }
  .result:empty { display: none; }
  .nudge { margin-top: 9px; background: var(--high); border-radius: 8px; padding: 9px 11px; font-weight: 600; }
  .win { background: var(--go-soft); border: 1.5px solid var(--go); color: #0a5a42; border-radius: 10px; padding: 11px; font-weight: 700; animation: pop .35s ease-out; }
  .note { color: var(--muted); padding: 6px 2px; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .win { animation: none; } }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .row .btn { flex: 1; white-space: nowrap; }
  .demo { margin-top: 12px; display: none; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .demo.on { display: flex; }
</style>
</head>
<body>
<div class="top">
  <div class="brand">Teach<i>ify</i></div>
  <div class="score"><span id="who">Maya</span><span class="xp" id="xp">0 XP</span><span id="streak">0 streak</span></div>
</div>
<div class="tabs" id="tabs" role="group" aria-label="Choose a problem"></div>
<div class="card">
  <div class="ask" id="ask"></div>
  <div class="problem" id="problem"></div>
  <label for="work">Your work, one step per line</label>
  <textarea id="work" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <input type="file" id="photoFile" accept="image/*" capture="environment" hidden>
  <button class="btn photo" id="photo">Take a photo of my work</button>
  <button class="btn primary check" id="check">Check my work</button>
  <div class="result" id="result" aria-live="polite"></div>
</div>
<div class="row"><button class="btn" id="hand">✋ I'm stuck</button></div>
<div class="demo" id="demo">
  Demo:
  <button class="btn quiet" id="fillWrong">Fill a mistake</button>
  <button class="btn quiet" id="fillRight">Fill the fix</button>
</div>
<script>
const STUDENT = "12", DEVICE = "desk-07", MAX_PHOTO_SIDE = 1600;
let problems = [], current = null;
const $ = (id) => document.getElementById(id);
if (new URLSearchParams(location.search).has("demo")) $("demo").classList.add("on");

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function renderWork(rows) {
  return '<div class="work">' + rows.map((r, i) =>
    `<div class="${r.status}"><span class="n">${i + 1}</span>${esc(r.text)}</div>`).join("") + "</div>";
}
function select(p) {
  current = p;
  $("ask").textContent = `${p.course} · ${p.prompt}`;
  $("problem").textContent = p.kind === "derivative" ? `f(x) = ${p.text}` : p.text;
  $("work").value = ""; $("result").innerHTML = "";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === p.id));
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function showAttempt(a) {
  let html = renderWork(a.rows);
  if (a.verdict === "error") html += `<div class="nudge">Check line ${a.first_error + 1}. ${esc(a.nudge)}</div>`;
  if (a.verdict === "in_progress") html += '<p class="note">Every step so far holds up. Keep going until you reach the answer.</p>';
  if (a.verdict === "unreadable") html += '<p class="note">Write each step as math, such as 3x+6=2x+11.</p>';
  if (a.reward) html += `<div class="win">${a.reward.comeback ? "Comeback! You found your own mistake." : "Correct!"} +${a.reward.points} XP</div>`;
  $("result").innerHTML = html;
}
$("check").onclick = async () => {
  const lines = $("work").value.split("\n").filter(l => l.trim());
  if (!lines.length) { $("result").innerHTML = '<p class="note">Write at least one step first.</p>'; return; }
  try {
    showAttempt(await post("/api/attempt", { student_id: STUDENT, problem_id: current.id, lines }));
  } catch (e) { $("result").innerHTML = '<p class="note">Could not reach the server. Try again.</p>'; }
};
// Decoding through an <img> applies the photo's EXIF rotation, so the upload is upright.
async function photoToJpeg(file) {
  const url = URL.createObjectURL(file), img = new Image();
  try {
    img.src = url;
    await img.decode();
    const scale = Math.min(1, MAX_PHOTO_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";  // JPEG has no alpha; transparent pixels would turn black.
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(done => canvas.toBlob(done, "image/jpeg", 0.85));
    if (!blob) throw new Error("encode failed");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
$("photo").onclick = () => $("photoFile").click();
$("photoFile").onchange = async (e) => {
  const file = e.target.files[0], problem = current;
  e.target.value = "";  // Otherwise picking the same photo again fires no change event.
  if (!file || !problem) return;
  const btn = $("photo"), label = btn.textContent;
  btn.disabled = true; btn.textContent = "Reading your work…";
  $("result").innerHTML = "";
  try {
    const body = await photoToJpeg(file);
    const r = await fetch(`/api/photo/${encodeURIComponent(STUDENT)}?problem_id=${encodeURIComponent(problem.id)}`,
      { method: "POST", headers: { "Content-Type": "image/jpeg" }, body });
    if (!r.ok) throw new Error(r.status);
    const a = await r.json();
    if (!a.lines || !a.lines.length) throw new Error("no lines");
    if (current !== problem) return;  // The student moved on; don't fill another problem's box.
    $("work").value = a.lines.join("\n");
    showAttempt(a);
  } catch (err) {
    if (current === problem) $("result").innerHTML = '<p class="note">Couldn\'t read that photo. Type your steps instead.</p>';
  } finally { btn.disabled = false; btn.textContent = label; }
};
$("hand").onclick = async () => {
  try {
    await post(`/api/device/${DEVICE}/press`, { source: "virtual", problem_id: current.id });
    $("hand").textContent = "✋ Your teacher has been notified";
  } catch (e) { $("hand").textContent = "Could not send. Try again."; }
};
$("fillWrong").onclick = () => { $("work").value = current.sample_wrong.join("\n"); };
$("fillRight").onclick = () => { $("work").value = current.sample_right.join("\n"); };

fetch("/api/problems").then(r => r.json()).then(list => {
  problems = list;
  $("tabs").innerHTML = list.map(p => `<button data-id="${p.id}" aria-pressed="false">${esc(p.course)}: ${esc(p.text)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => select(problems.find(p => p.id === b.dataset.id)));
  select(list[0]);
});
new EventSource("/api/stream").onmessage = (e) => {
  const s = JSON.parse(e.data), me = s.students.find(x => x.id === STUDENT), led = s.devices[DEVICE].led;
  $("xp").textContent = `${me.xp} XP`;
  $("streak").textContent = `${me.streak} streak`;
  $("hand").textContent = led === "coming" ? "✋ Your teacher is on the way" : led === "waiting" ? "✋ Your teacher has been notified" : "✋ I'm stuck";
};
</script>
</body>
</html>
