<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teachify Teacher</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { padding: 14px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .bar h1 { font: 700 21px/1.1 var(--serif); }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 3px 9px; color: var(--muted); }
  .pill.on { color: var(--go); border-color: var(--go); background: var(--go-soft); }
  .pill.bad { color: var(--pen); border-color: var(--pen); background: var(--pen-soft); }
  .stats { display: flex; gap: 20px; margin-bottom: 12px; flex-wrap: wrap; }
  .stats b { font: 700 25px/1 var(--serif); display: block; }
  .stats span { color: var(--muted); font-size: 12px; }
  .seats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin-bottom: 14px; }
  .seat { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 1px; text-align: center; font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .seat.stuck { background: var(--pen); border-color: var(--pen); color: #fff; font-weight: 700; }
  .seat.done { background: var(--go-soft); border-color: var(--go); color: #0a5a42; }
  .banner { background: var(--high); border: 1.5px solid var(--ink); border-radius: 10px; padding: 11px 13px; margin-bottom: 12px; box-shadow: 3px 3px 0 var(--ink); }
  .banner h2 { font: 700 16px/1.25 var(--serif); margin-bottom: 3px; }
  .alert { background: var(--card); border: 1.5px solid var(--ink); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .alert.resolved { opacity: .55; border-color: var(--line); }
  .alert header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
  .alert h3 { font-size: 15px; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 5px; padding: 2px 6px; background: var(--pen-soft); color: var(--pen); }
  .tag.sim { background: #ece8da; color: var(--muted); }
  .tag.hw { background: var(--blue-soft); color: var(--blue); }
  .prob { font: 13px var(--mono); color: var(--muted); margin-bottom: 4px; }
  .brief { margin-top: 9px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .brief p { margin-bottom: 5px; }
  .brief b { font-weight: 650; }
  .by { font-size: 11px; color: var(--muted); }
  .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .acts .right { margin-left: auto; display: flex; gap: 4px; }
  .acts [aria-pressed=true] { background: var(--ink); color: #fff; }
  .empty { color: var(--muted); padding: 20px 4px; text-align: center; }
  .foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
  @media (max-width: 520px) { .seats { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="bar">
  <h1>Period 3 · Live class</h1>
  <div class="pills" id="pills"></div>
</div>
<div class="stats" id="stats"></div>
<div class="seats" id="seats" aria-label="Seating chart"></div>
<div id="clusters"></div>
<div id="alerts" aria-live="polite"></div>
<div class="foot">
  Demo controls:
  <button class="btn quiet" id="sim">Simulate class</button>
  <button class="btn quiet" id="reset">Reset</button>
  <a class="by" href="/api/export/training.jsonl">Export rated briefs for fine-tuning</a>
</div>
<script>
const $ = (id) => document.getElementById(id);
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

function pill(label, cfg) {
  const cls = cfg.last_ok === false ? "bad" : cfg.configured ? "on" : "";
  const text = cfg.last_ok === false ? "failed" : cfg.last_ok ? "live" : cfg.configured ? "configured" : "not connected";
  return `<span class="pill ${cls}">${label}: ${text}</span>`;
}
function workHtml(rows) {
  return '<div class="work">' + rows.map((r, i) =>
    `<div class="${esc(r.status)}"><span class="n">${i + 1}</span>${esc(r.text)}</div>`).join("") + "</div>";
}
function alertHtml(a) {
  const tags = [];
  if (a.help_requested) tags.push(`<span class="tag hw">${a.source === "hardware" ? "Desk button" : "Asked for help"}</span>`);
  if (a.misconception) tags.push(`<span class="tag">${esc(a.label)}</span>`);
  if (a.simulated) tags.push('<span class="tag sim">Simulated</span>');
  const provider = a.brief.provider + (a.brief.latency_ms ? ` · ${a.brief.latency_ms} ms` : "");
  const acts = a.status === "resolved" ? "" : `
    <div class="acts">
      ${a.status === "open" ? `<button class="btn primary" data-act="ack" data-id="${a.id}">On my way</button>` : ""}
      <button class="btn" data-act="resolve" data-id="${a.id}">Resolved</button>
      <span class="right">
        <button class="btn quiet" aria-label="Helpful" aria-pressed="${a.feedback === true}" data-act="yes" data-id="${a.id}">Helpful</button>
        <button class="btn quiet" aria-label="Off target" aria-pressed="${a.feedback === false}" data-act="no" data-id="${a.id}">Off target</button>
      </span>
    </div>`;
  return `<article class="alert ${a.status}">
    <header><h3>${esc(a.student)} · Seat ${a.seat}</h3><div>${tags.join(" ")}</div></header>
    <div class="prob">${esc(a.course)} · ${esc(a.problem)}</div>
    ${a.rows.length ? workHtml(a.rows) : ""}
    <div class="brief">
      <p><b>What happened:</b> ${esc(a.brief.diagnosis)}</p>
      <p><b>Try asking:</b> ${esc(a.brief.say)}</p>
      ${a.brief.practice ? `<p><b>Practice next:</b> <span class="work">${esc(a.brief.practice)}</span></p>` : ""}
      <div class="by">Math checked by SymPy · Wording: ${esc(provider)}</div>
    </div>${acts}
  </article>`;
}
function render(s) {
  const open = s.alerts.filter(a => a.status !== "resolved");
  const dev = s.devices["desk-07"];
  $("pills").innerHTML = pill("Google Cloud", s.ai.gemini) + pill("Thinking Machines", s.ai.tinker) +
    `<span class="pill ${dev.hardware_online ? "on" : ""}">Desk node: ${dev.hardware_online ? "online" : "virtual"}</span>`;
  $("stats").innerHTML = `
    <div><b>${open.length}</b><span>need attention</span></div>
    <div><b>${s.students.filter(x => x.status === "done").length}</b><span>finished</span></div>
    <div><b>${s.self_corrected}</b><span>fixed it themselves</span></div>`;
  $("seats").innerHTML = s.students.map(x => `<div class="seat ${x.status}" title="${esc(x.name)}">${esc(x.name)}</div>`).join("");
  $("clusters").innerHTML = s.clusters.map(c => `<div class="banner">
    <h2>${c.count} students have the same issue: ${esc(c.label)}</h2>
    <div>Pause for a 2-minute reteach. ${esc(c.reteach)}</div></div>`).join("");
  $("alerts").innerHTML = s.alerts.length ? s.alerts.slice(0, 20).map(alertHtml).join("")
    : '<div class="empty">No one is stuck right now.</div>';
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === "ack") post(`/api/alert/${id}/ack`);
  if (act === "resolve") post(`/api/alert/${id}/resolve`);
  if (act === "yes") post(`/api/alert/${id}/feedback`, { helpful: true });
  if (act === "no") post(`/api/alert/${id}/feedback`, { helpful: false });
});
$("sim").onclick = () => post("/api/demo/simulate");
$("reset").onclick = () => post("/api/demo/reset");
new EventSource("/api/stream").onmessage = (e) => render(JSON.parse(e.data));
</script>
</body>
</html>
